[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventlens"
version = "0.1.0"
description = "Developer-first Terminal & Web Kafka Event Stream Debugger & DLQ Studio"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Alexandr Motologa" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "aiokafka>=0.11.0",
    "textual>=0.75.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "jmespath>=1.0.1",
    "protobuf>=5.27.0",
    "pydantic>=2.7.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
eventlens = "eventlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eventlens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
