<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern App Icon Badge Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Orbit / Kafka Stream Wave Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#cyanMintGrad)" stroke-width="3" opacity="0.4" />

  <!-- Chameleon Body & Head (Minimalist Geometric Vector Silhouette) -->
  <path d="M 120 350 C 105 310, 115 250, 155 210 C 190 175, 240 160, 290 165 C 340 170, 395 195, 415 245 C 425 270, 420 295, 395 310 C 370 325, 345 320, 330 305 C 315 290, 310 270, 320 250 C 325 240, 315 230, 300 230 C 275 230, 255 245, 250 270 C 240 315, 205 350, 155 355 C 138 357, 126 355, 120 350 Z" 
        fill="#1e293b" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />

  <!-- Chameleon Curled Tail Accent -->
  <path d="M 125 345 C 95 350, 75 320, 85 290 C 92 270, 115 265, 125 280 C 135 295, 120 315, 105 310" 
        fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />

  <!-- Spine Scales / Stream Tick Marks -->
  <circle cx="175" cy="190" r="4" fill="#38bdf8" />
  <circle cx="210" cy="170" r="5" fill="#38bdf8" />
  <circle cx="250" cy="162" r="6" fill="#10b981" />
  <circle cx="295" cy="166" r="5" fill="#10b981" />
  <circle cx="340" cy="182" r="4" fill="#10b981" />

  <!-- Chameleon Lens Eye (Optical Aperture & Focus) -->
  <g transform="translate(325, 235)">
    <!-- Lens Outer Bezel -->
    <circle cx="0" cy="0" r="68" fill="#0b1329" stroke="#38bdf8" stroke-width="6" filter="url(#subtleGlow)" />
    <!-- Secondary Aperture Ring -->
    <circle cx="0" cy="0" r="54" fill="url(#lensGrad)" stroke="#7dd3fc" stroke-width="2" />
    
    <!-- Aperture Blades (Camera Lens Geometry) -->
    <polygon points="0,-50 30,-38 18,-12" fill="#0369a1" opacity="0.7" />
    <polygon points="38,-30 48,5 20,12" fill="#0284c7" opacity="0.7" />
    <polygon points="45,15 22,46 -4,22" fill="#0369a1" opacity="0.7" />
    <polygon points="12,46 -28,40 -15,14" fill="#0284c7" opacity="0.7" />
    <polygon points="-36,28 -46,-8 -18,-14" fill="#0369a1" opacity="0.7" />
    <polygon points="-42,-18 -10,-48 0,-20" fill="#0284c7" opacity="0.7" />

    <!-- Inner Pupil / Precision Sensor -->
    <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <circle cx="0" cy="0" r="14" fill="#10b981" />
    <circle cx="5" cy="-5" r="4" fill="#ffffff" />
    
    <!-- Focal Reticle Crosshairs -->
    <line x1="-36" y1="0" x2="-28" y2="0" stroke="#7dd3fc" stroke-width="2" />
    <line x1="28" y1="0" x2="36" y2="0" stroke="#7dd3fc" stroke-width="2" />
    <line x1="0" y1="-36" x2="0" y2="-28" stroke="#7dd3fc" stroke-width="2" />
    <line x1="0" y1="28" x2="0" y2="36" stroke="#7dd3fc" stroke-width="2" />
  </g>

  <!-- Focused Event Stream Particle (The Bug / Message in Sight) -->
  <g transform="translate(425, 215)">
    <circle cx="0" cy="0" r="12" fill="#ef4444" filter="url(#subtleGlow)" />
    <circle cx="0" cy="0" r="6" fill="#fca5a5" />
    <!-- Pulse Waves around target -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" />
  </g>

  <!-- Connection Ray (Optical Focus Beam) -->
  <line x1="393" y1="230" x2="413" y2="219" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
</svg>
